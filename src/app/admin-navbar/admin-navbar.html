<header class="bg-white border-b px-4 h-16 flex items-center justify-between shadow-sm flex-shrink-0 z-10">
  <div class="flex items-center">
    <button (click)="toggleSidebar()" class="p-2 rounded-full text-gray-500 hover:bg-gray-100">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <div class="w-px h-6 bg-gray-200 mx-4"></div>
    <div class="cursor-pointer" (click)="navigateToDashboard()">
      <img src="/iSTOKVEL2.png" alt="STOKVEL Logo" class="h-12 w-auto" />
    </div>
  </div>
  
  <div class="flex items-center space-x-2">
    <!-- Notifications -->
    <div class="relative">
      <button
        (click)="toggleNotifications()"
        class="p-2 text-gray-600 hover:text-blue-600 relative transition-colors duration-200"
      >
        <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5z"></path>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17h6m-6 0V9a3 3 0 0 1 6 0v8m-6 0H9"></path>
        </svg>
        <span *ngIf="unreadCount > 0" class="absolute -top-1 -right-1 h-5 w-5 bg-red-500 rounded-full text-xs text-white flex items-center justify-center font-medium">
          {{ unreadCount }}
        </span>
      </button>

      <!-- Notifications Dropdown -->
      <div *ngIf="isNotificationsOpen" class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-lg border border-gray-200 z-50">
        <div class="p-4">
          <h3 class="text-lg font-semibold text-gray-900 mb-3">Notifications</h3>
          <div class="space-y-2 max-h-64 overflow-y-auto">
            <div *ngIf="notifications.length > 0; else noNotifications">
              <div
                *ngFor="let notification of notifications"
                (click)="handleNotificationClick(notification.id)"
                class="p-3 rounded-lg transition-colors duration-200 cursor-pointer"
                [ngClass]="notification.is_read ? 'bg-gray-50' : 'bg-blue-50'"
              >
                <p class="font-medium text-gray-900">{{ notification.title }}</p>
                <p class="text-sm text-gray-600">{{ notification.message }}</p>
                <p class="text-xs text-gray-500 mt-1">
                  {{ notification.created_at | date:'medium' }}
                </p>
              </div>
            </div>
            <ng-template #noNotifications>
              <p class="text-gray-500 text-center py-4">No notifications</p>
            </ng-template>
          </div>
        </div>
      </div>
    </div>

    <!-- Profile Dropdown -->
    <div class="relative">
      <button
        (click)="toggleProfile()"
        class="flex items-center space-x-2 text-gray-700 hover:text-blue-600 transition-colors duration-200"
      >
        <div class="h-8 w-8 rounded-full bg-gradient-to-r from-blue-500 to-blue-600 flex items-center justify-center">
          <svg class="h-5 w-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
          </svg>
        </div>
        <span class="font-medium">Admin</span>
        <svg class="h-4 w-4 transition-transform duration-200" [ngClass]="isProfileOpen ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
        </svg>
      </button>

      <!-- Profile Dropdown Menu -->
      <div *ngIf="isProfileOpen" class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-lg border border-gray-200 z-50">
        <div class="py-2">
          <button
            (click)="navigateToProfile()"
            class="w-full flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors duration-200"
          >
            <svg class="h-4 w-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
            Your Profile
          </button>
          <button
            (click)="navigateToSettings()"
            class="w-full flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition-colors duration-200"
          >
            <svg class="h-4 w-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
            Settings
          </button>
          <hr class="my-2" />
          <button
            (click)="handleLogout()"
            class="w-full flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors duration-200"
          >
            <svg class="h-4 w-4 mr-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
            Sign out
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
