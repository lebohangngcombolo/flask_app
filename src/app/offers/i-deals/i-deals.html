<div class="max-w-6xl mx-auto px-6 py-10">
  <h1 class="text-2xl font-bold mb-6">i-Deals</h1>
  
  <div class="flex space-x-4 mb-8">
    <button
      *ngFor="let cat of categories"
      (click)="selectCategory(cat)"
      class="px-4 py-2 rounded-full border font-semibold"
      [class.bg-blue-600]="selectedCategory === cat"
      [class.text-white]="selectedCategory === cat"
      [class.bg-gray-100]="selectedCategory !== cat"
      [class.text-gray-700]="selectedCategory !== cat"
    >
      {{ cat }}
    </button>
  </div>
  
  <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-8">
    <div
      *ngFor="let deal of filteredDeals"
      class="bg-white rounded-xl shadow p-6 flex flex-col"
    >
      <img
        [src]="deal.image"
        [alt]="deal.title"
        class="w-full h-40 object-cover rounded-lg mb-4"
        (error)="onImageError($event)"
      />
      <h2 class="text-lg font-bold mb-2">{{ deal.title }}</h2>
      <p class="text-gray-600 mb-2">{{ deal.description }}</p>
      <div class="flex items-center justify-between mb-2">
        <span class="text-blue-700 font-semibold">{{ deal.price }}</span>
        <span class="text-xs text-gray-500">by {{ deal.partner }}</span>
      </div>
      <button
        (click)="viewDeal(deal)"
        class="mt-auto px-6 py-2 bg-blue-600 text-white rounded-lg font-semibold text-center"
      >
        View Details
      </button>
    </div>
  </div>

  <!-- Deal Detail Modal -->
  <div *ngIf="selectedDeal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl shadow-lg max-w-md w-full p-6">
      <div class="flex justify-between items-start mb-4">
        <h3 class="text-xl font-bold">{{ selectedDeal.title }}</h3>
        <button 
          (click)="closeDeal()"
          class="text-gray-500 hover:text-gray-700 text-2xl leading-none"
        >
          ×
        </button>
      </div>
      
      <img
        [src]="selectedDeal.image"
        [alt]="selectedDeal.title"
        class="w-full h-48 object-cover rounded-lg mb-4"
        (error)="onImageError($event)"
      />
      
      <p class="text-gray-600 mb-4">{{ selectedDeal.description }}</p>
      
      <div class="flex items-center justify-between mb-4">
        <span class="text-blue-700 font-semibold text-lg">{{ selectedDeal.price }}</span>
        <span class="text-sm text-gray-500">by {{ selectedDeal.partner }}</span>
      </div>
      
      <div class="flex space-x-3">
        <button
          class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg font-semibold"
          (click)="closeDeal()"
        >
          Close
        </button>
        <a
          [href]="selectedDeal.link"
          class="flex-1 px-4 py-2 bg-gray-100 text-gray-700 rounded-lg font-semibold text-center"
        >
          Learn More
        </a>
      </div>
    </div>
  </div>
</div>
