<div class="h-screen flex flex-col bg-gray-100">
  <header class="bg-white border-b px-4 h-16 flex items-center justify-between shadow-sm">
    <div class="flex items-center">
      <button (click)="sidebarOpen = !sidebarOpen" class="p-2 rounded-full text-gray-500 hover:bg-gray-100">
        <span class="block w-5 h-0.5 bg-gray-600 mb-1"></span>
        <span class="block w-5 h-0.5 bg-gray-600 mb-1"></span>
        <span class="block w-5 h-0.5 bg-gray-600"></span>
      </button>
      <div class="w-px h-6 bg-gray-200 mx-4"></div>
      <div class="cursor-pointer flex items-center" (click)="navTo('/dashboard')">
        <img src="iSTOKVEL2.png" alt="i-STOKVEL Logo" class="h-10 w-auto" />
      </div>
    </div>

    <div class="flex items-center space-x-4">
      <div class="flex items-center space-x-2">
        <button (click)="navTo('/dashboard/marketplace')" class="text-sm font-medium px-3 py-2 rounded hover:bg-gray-100">Offers</button>
        <button (click)="navTo('/learning')" class="text-sm font-medium px-3 py-2 rounded hover:bg-gray-100">Learning</button>
      </div>

      <!-- Fixed Notification Section -->
      <div class="relative">
        <button class="relative p-2 rounded-full hover:bg-gray-100 transition-colors" (click)="isNotificationsOpen = !isNotificationsOpen">
          <!-- Bell Icon -->
          <svg class="w-6 h-6 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
          </svg>
          
          <!-- Notification Badge -->
          <span *ngIf="unread.length > 0" class="absolute -top-1 -right-1 bg-red-600 text-white rounded-full text-xs px-2 py-0.5 font-bold min-w-[20px] text-center">
            {{ unread.length > 99 ? '99+' : unread.length }}
          </span>
        </button>

        <!-- Notification Dropdown -->
        <div *ngIf="isNotificationsOpen" class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg border z-50 max-h-96 overflow-y-auto">
          <div class="p-4 border-b">
            <div class="flex items-center justify-between">
              <h3 class="font-semibold text-gray-900">Notifications</h3>
              <div class="flex space-x-1">
                <button 
                  (click)="tab = 'unread'" 
                  [class.bg-blue-100]="tab === 'unread'" 
                  class="px-2 py-1 text-xs rounded transition-colors"
                  [class.text-blue-700]="tab === 'unread'"
                  [class.text-gray-600]="tab !== 'unread'"
                >
                  Unread ({{ unread.length }})
                </button>
                <button 
                  (click)="tab = 'read'" 
                  [class.bg-blue-100]="tab === 'read'" 
                  class="px-2 py-1 text-xs rounded transition-colors"
                  [class.text-blue-700]="tab === 'read'"
                  [class.text-gray-600]="tab !== 'read'"
                >
                  Read ({{ read.length }})
                </button>
              </div>
            </div>
          </div>
          
          <div class="max-h-64 overflow-y-auto">
            <div *ngFor="let n of (tab === 'unread' ? unread : read)" class="p-3 border-b last:border-0 hover:bg-gray-50 cursor-pointer transition-colors">
              <div class="flex items-start justify-between">
                <div class="flex-1">
                  <p class="text-sm font-medium text-gray-900">{{ n.title }}</p>
                  <p class="text-xs text-gray-500 mt-1">{{ n.message }}</p>
                  <p class="text-xs text-gray-400 mt-1">{{ n.created_at | date:'short' }}</p>
                </div>
                <div *ngIf="!n.read" class="w-2 h-2 bg-blue-600 rounded-full ml-2 flex-shrink-0"></div>
              </div>
            </div>
            
            <div *ngIf="(tab === 'unread' ? unread : read).length === 0" class="p-4 text-center text-gray-500">
              <svg class="w-12 h-12 mx-auto text-gray-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
              </svg>
              <p class="text-sm">No {{ tab }} notifications</p>
            </div>
          </div>
          
          <div class="p-2 border-t flex justify-end">
            <button 
              *ngIf="tab === 'unread' && unread.length > 0" 
              (click)="markAllAsRead()" 
              class="text-xs text-indigo-600 hover:text-indigo-800 hover:underline transition-colors"
            >
              Mark all as read
            </button>
          </div>
        </div>
      </div>

      <app-profile-dropdown 
        [user]="currentUser" 
        (profileUpdated)="onProfileUpdated()">
      </app-profile-dropdown>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="bg-[#23295A] min-h-screen w-64 flex flex-col py-6 px-2" [class.hidden]="!sidebarOpen">
      <nav class="flex-1 space-y-2">
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white hover:bg-blue-700 transition-colors" (click)="navTo('/dashboard/profile')">User Profile</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white hover:bg-blue-700 transition-colors" (click)="navTo('/dashboard/wallet')">Digital Wallet</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white hover:bg-blue-700 transition-colors" (click)="navTo('/dashboard/kyc')">KYC</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white hover:bg-blue-700 transition-colors" (click)="navTo('/dashboard/beneficiaries')">Beneficiaries</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white hover:bg-blue-700 transition-colors" (click)="navTo('/dashboard/referrals')">Refer &amp; Earn</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white hover:bg-blue-700 transition-colors" (click)="navTo('/dashboard/groups')">Stokvel Groups</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white hover:bg-blue-700 transition-colors" (click)="navTo('/dashboard/payout')">Request Payout</button>
      </nav>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
