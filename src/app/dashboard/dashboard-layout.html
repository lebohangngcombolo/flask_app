<div class="h-screen flex flex-col bg-gray-100">
  <header class="bg-white border-b px-4 h-16 flex items-center justify-between shadow-sm">
    <div class="flex items-center">
      <button (click)="sidebarOpen.set(!sidebarOpen())" class="p-2 rounded-full text-gray-500 hover:bg-gray-100">
        <span class="block w-5 h-0.5 bg-gray-600 mb-1"></span>
        <span class="block w-5 h-0.5 bg-gray-600 mb-1"></span>
        <span class="block w-5 h-0.5 bg-gray-600"></span>
      </button>
      <div class="w-px h-6 bg-gray-200 mx-4"></div>
      <div class="cursor-pointer flex items-center" (click)="navTo('/dashboard')">
        <img src="iSTOKVEL2.png" alt="i-STOKVEL Logo" class="h-10 w-auto" />
      </div>
    </div>

    <div class="flex items-center gap-4 relative">
      <div class="flex items-center space-x-2">
        <button (click)="navTo('/dashboard/marketplace')" class="text-sm font-medium px-3 py-2 rounded hover:bg-gray-100">Offers</button>
        <button (click)="navTo('/learning')" class="text-sm font-medium px-3 py-2 rounded hover:bg-gray-100">Learning</button>
      </div>

      <div class="relative">
        <button class="relative" (click)="isNotificationsOpen.set(!isNotificationsOpen())">
          <span class="inline-block w-6 h-6 rounded-full border border-gray-500"></span>
          <span *ngIf="unread().length" class="absolute -top-2 -right-2 bg-red-600 text-white rounded-full text-xs px-2 py-0.5 font-bold">
            {{ unread().length }}
          </span>
        </button>

        <div *ngIf="isNotificationsOpen()" class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg border z-50 max-h-96 overflow-y-auto">
          <div class="p-4 border-b">
            <div class="flex items-center justify-between">
              <h3 class="font-semibold">Notifications</h3>
              <div class="flex space-x-1">
                <button (click)="tab.set('unread')" [class.bg-blue-100]="tab()==='unread'" class="px-2 py-1 text-xs rounded">Unread ({{ unread().length }})</button>
                <button (click)="tab.set('read')" [class.bg-blue-100]="tab()==='read'" class="px-2 py-1 text-xs rounded">Read ({{ read().length }})</button>
              </div>
            </div>
          </div>
          <div class="max-h-64 overflow-y-auto">
            <div *ngFor="let n of (tab()==='unread' ? unread() : read())" class="p-3 border-b last:border-0 hover:bg-gray-50 cursor-pointer">
              <div class="flex items-start justify-between">
                <div class="flex-1">
                  <p class="text-sm font-medium">{{ n.title }}</p>
                  <p class="text-xs text-gray-500 mt-1">{{ n.message }}</p>
                  <p class="text-xs text-gray-400 mt-1">{{ n.created_at | date }}</p>
                </div>
                <div *ngIf="!n.read" class="w-2 h-2 bg-blue-600 rounded-full ml-2"></div>
              </div>
            </div>
            <div *ngIf="(tab()==='unread' ? unread() : read()).length===0" class="p-4 text-center text-gray-500">
              No {{ tab() }} notifications
            </div>
          </div>
          <div class="p-2 border-t flex justify-end">
            <button *ngIf="tab()==='unread' && unread().length" class="text-xs text-indigo-600 hover:underline" (click)="markAllAsRead()">Mark all as read</button>
          </div>
        </div>
      </div>

      <div class="w-8 h-8 rounded-full bg-gray-300"></div>
    </div>
  </header>

  <div class="flex flex-1 overflow-hidden">
    <aside class="bg-[#23295A] min-h-screen w-64 flex flex-col py-6 px-2" [class.hidden]="!sidebarOpen()">
      <nav class="flex-1 space-y-2">
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white" (click)="navTo('/dashboard/profile')">User Profile</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white" (click)="navTo('/dashboard/wallet')">Digital Wallet</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white" (click)="navTo('/dashboard/kyc')">KYC</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white" (click)="navTo('/dashboard/beneficiaries')">Beneficiaries</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white" (click)="navTo('/dashboard/referrals')">Refer &amp; Earn</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white" (click)="navTo('/dashboard/groups')">Stokvel Groups</button>
        <button class="flex items-center w-full gap-3 px-4 py-2 rounded-lg text-white" (click)="navTo('/dashboard/claims')">Request Payout</button>
      </nav>
    </aside>

    <main class="flex-1 p-6 overflow-y-auto">
      <router-outlet />
    </main>
  </div>
</div>
