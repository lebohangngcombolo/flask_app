<div class="relative">
  <!-- Profile Button with Hover Effect -->
  <button
    (click)="toggleDropdown()"
    class="flex items-center space-x-2 p-2 rounded-full hover:bg-gray-100 transition-colors"
  >
    <div *ngIf="user?.profilePicture; else defaultAvatar" class="w-8 h-8 rounded-full ring-2 ring-blue-500 overflow-hidden">
      <img
        [src]="getProfilePictureUrl(user?.profilePicture)"
        alt="Profile"
        class="w-full h-full object-cover"
        (error)="$event.target.src = '/default-avatar.png'"
      />
    </div>
    <ng-template #defaultAvatar>
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
      </div>
    </ng-template>
  </button>

  <!-- Dropdown Menu -->
  <div *ngIf="isOpen" 
       class="absolute right-0 mt-2 w-72 bg-white rounded-xl shadow-lg py-2 z-50">
    
    <!-- Profile Header -->
    <div class="px-4 py-3 border-b">
      <div class="flex items-center space-x-3">
        <div class="relative group cursor-pointer" (click)="handleProfilePictureClick()">
          <div *ngIf="user?.profilePicture; else defaultAvatarLarge" class="w-12 h-12 rounded-full ring-2 ring-blue-500 overflow-hidden">
            <img
              [src]="getProfilePictureUrl(user?.profilePicture)"
              alt="Profile"
              class="w-full h-full object-cover"
            />
          </div>
          <ng-template #defaultAvatarLarge>
            <div class="w-12 h-12 rounded-full bg-gradient-to-br from-blue-500 to-blue-600 flex items-center justify-center text-white">
              <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
              </svg>
            </div>
          </ng-template>
          <div class="absolute inset-0 rounded-full bg-black bg-opacity-50 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.07-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.51.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </div>
        </div>
        <div>
          <p class="font-medium text-gray-900">{{ user?.name || 'User' }}</p>
          <p class="text-sm text-gray-500">{{ user?.email || 'user@example.com' }}</p>
        </div>
      </div>
    </div>

    <!-- Notifications Settings -->
    <div class="px-4 py-3 border-b">
      <h3 class="text-sm font-medium text-gray-900 mb-2">Notifications</h3>
      <div class="space-y-2">
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span class="text-sm text-gray-700">Email Notifications</span>
          </div>
          <button
            (click)="handleNotificationToggle('email')"
            [class]="'relative inline-flex h-6 w-11 items-center rounded-full transition-colors ' + (notifications.email ? 'bg-blue-600' : 'bg-gray-200')"
          >
            <span
              [class]="'inline-block h-4 w-4 transform rounded-full bg-white transition-transform ' + (notifications.email ? 'translate-x-6' : 'translate-x-1')"
            ></span>
          </button>
        </div>
        <div class="flex items-center justify-between">
          <div class="flex items-center space-x-2">
            <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-5 5v-5z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
            <span class="text-sm text-gray-700">Push Notifications</span>
          </div>
          <button
            (click)="handleNotificationToggle('push')"
            [class]="'relative inline-flex h-6 w-11 items-center rounded-full transition-colors ' + (notifications.push ? 'bg-emerald-600' : 'bg-gray-200')"
          >
            <span
              [class]="'inline-block h-4 w-4 transform rounded-full bg-white transition-transform ' + (notifications.push ? 'translate-x-6' : 'translate-x-1')"
            ></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Theme Selector -->
    <div class="px-4 py-3 border-b">
      <h3 class="text-sm font-medium text-gray-900 mb-2">Theme</h3>
      <div class="flex items-center justify-around p-1 rounded-lg bg-gray-100">
        <button
          (click)="setTheme('light')"
          [class]="'flex-1 flex items-center justify-center gap-2 p-2 rounded-md text-sm transition-colors ' + (getCurrentTheme() === 'light' ? 'bg-white text-blue-600 shadow-sm' : 'text-gray-600 hover:bg-gray-200')"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
          </svg>
          <span>Light</span>
        </button>
        <button
          (click)="setTheme('dark')"
          [class]="'flex-1 flex items-center justify-center gap-2 p-2 rounded-md text-sm transition-colors ' + (getCurrentTheme() === 'dark' ? 'bg-gray-700 text-white shadow-sm' : 'text-gray-600 hover:bg-gray-200')"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
          </svg>
          <span>Dark</span>
        </button>
      </div>
    </div>

    <!-- Actions -->
    <div class="px-4 py-2">
      <button
        (click)="handleLogout()"
        class="flex items-center space-x-2 w-full px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-md"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
        </svg>
        <span>Logout</span>
      </button>
    </div>
  </div>

  <!-- Upload Modal -->
  <div *ngIf="showUploadModal" 
       class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 w-[480px] max-w-[90vw]">
      <div class="flex justify-between items-center mb-6">
        <h3 class="text-xl font-semibold flex items-center gap-2">
          <svg class="w-5 h-5 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z"></path>
          </svg>
          Profile Picture Studio
        </h3>
        <button
          (click)="closeUploadModal()"
          class="text-gray-500 hover:text-gray-700 transition-colors"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
          </svg>
        </button>
      </div>

      <!-- Select Step -->
      <div *ngIf="uploadStep === 'select'" class="space-y-6">
        <div class="border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-500 transition-colors cursor-pointer"
             (click)="document.getElementById('fileInput')?.click()">
          <div class="space-y-4">
            <div class="w-20 h-20 mx-auto bg-blue-50 rounded-full flex items-center justify-center">
              <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
              </svg>
            </div>
            <div>
              <p class="text-lg font-medium text-gray-900">Drop your image here</p>
              <p class="text-sm text-gray-500">or click to browse</p>
            </div>
          </div>
          <input
            #fileInput
            type="file"
            (change)="onFileChange($event)"
            accept="image/*"
            class="hidden"
            id="fileInput"
          />
        </div>
      </div>

      <!-- Edit Step -->
      <div *ngIf="uploadStep === 'edit'" class="space-y-6">
        <div class="relative aspect-square w-full max-w-[300px] mx-auto">
          <img
            [src]="previewUrl || ''"
            alt="Preview"
            [class]="'w-full h-full rounded-xl object-cover ' + (selectedFilter !== 'none' ? 'filter-' + selectedFilter : '')"
          />
          <div class="absolute inset-0 bg-gradient-to-t from-black/50 to-transparent rounded-xl"></div>
        </div>

        <div class="space-y-4">
          <h4 class="font-medium text-gray-900">Choose a Filter</h4>
          <div class="grid grid-cols-3 gap-3">
            <button
              *ngFor="let filter of filters"
              (click)="selectedFilter = filter.name"
              [class]="'p-2 rounded-lg text-sm font-medium transition-all ' + (selectedFilter === filter.name ? 'bg-blue-100 text-blue-700 ring-2 ring-blue-500' : 'bg-gray-100 text-gray-700 hover:bg-gray-200')"
            >
              {{ filter.label }}
            </button>
          </div>
        </div>

        <div class="flex gap-3">
          <button
            (click)="uploadStep = 'select'"
            class="flex-1 py-2 px-4 border border-gray-300 rounded-lg text-gray-700 hover:bg-gray-50"
          >
            Back
          </button>
          <button
            (click)="handleUpload()"
            [disabled]="isUploading"
            class="flex-1 py-2 px-4 bg-blue-600 text-white rounded-lg hover:bg-blue-700 flex items-center justify-center gap-2 disabled:opacity-50"
          >
            <span *ngIf="isUploading">Uploading...</span>
            <span *ngIf="!isUploading">Apply Changes</span>
          </button>
        </div>
      </div>

      <!-- Complete Step -->
      <div *ngIf="uploadStep === 'complete'" class="text-center py-8">
        <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-4">
          <svg class="w-8 h-8 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
          </svg>
        </div>
        <h3 class="text-xl font-semibold text-gray-900 mb-2">Profile Updated!</h3>
        <p class="text-gray-500 mb-6">Your new profile picture has been saved successfully.</p>
        <button
          (click)="closeUploadModal()"
          class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
        >
          Done
        </button>
      </div>
    </div>
  </div>
</div>
