<div class="min-h-screen bg-gray-50 font-sans">
  <nav class="bg-white shadow-sm border-b border-gray-200 fixed w-full top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
      <div class="flex justify-between items-center h-16">
        <div class="flex items-center">
          <a routerLink="/" class="flex items-center">
            <img src="iSTOKVEL2.png" alt="i-STOKVEL Logo" class="h-10 w-auto" />
          </a>
        </div>

        <button
          class="md:hidden p-2 rounded-lg text-gray-600 hover:text-gray-900 hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200"
          (click)="toggleMobileMenu()"
        >
          <svg
            class="h-6 w-6"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            viewBox="0 0 24 24"
            stroke="currentColor"
          >
            <path *ngIf="!isMobileMenuOpen" d="M4 6h16M4 12h16M4 18h16" />
            <path *ngIf="isMobileMenuOpen" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>

        <div class="hidden md:flex items-center space-x-8">
          <a routerLink="/" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">Home</a>
          <a routerLink="/programs" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">Programs</a>
          <a routerLink="/about" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">About Us</a>
          <a routerLink="/news" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">News</a>
          <a routerLink="/contact" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">Contact</a>
        </div>

        <div class="hidden md:flex items-center space-x-3">
          <a routerLink="/login" class="text-gray-700 hover:text-blue-600 px-3 py-2 text-sm font-medium transition-colors duration-200">
            Login
          </a>
          <a routerLink="/signup" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition-colors duration-200 text-sm font-medium">
            Sign Up
          </a>
        </div>
      </div>

      <div class="md:hidden" [class.block]="isMobileMenuOpen" [class.hidden]="!isMobileMenuOpen">
        <div class="flex flex-col space-y-4 pb-4">
          <a routerLink="/" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">Home</a>
          <a routerLink="/programs" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">Programs</a>
          <a routerLink="/about" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">About Us</a>
          <a routerLink="/news" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">News</a>
          <a routerLink="/contact" class="text-gray-600 hover:text-gray-900 transition-colors duration-200 font-medium text-base">Contact</a>
          <div class="flex flex-col space-y-2 pt-2 border-t border-gray-200">
            <button 
              *ngIf="!hideAuthButtons"
              class="w-full text-gray-600 hover:text-gray-900 px-4 py-2 text-base font-medium transition-colors duration-200"
              (click)="navigateTo('/login')"
            >
              Login
            </button>
            <button 
              *ngIf="!hideAuthButtons"
              class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-base font-medium transition-colors duration-200 shadow-sm"
              (click)="navigateTo('/signup')"
            >
              Sign Up
            </button>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main class="pt-16">
    <ng-content></ng-content>
  </main>

  <app-chatbot></app-chatbot>

  <footer class="bg-gray-900 text-white py-12">
    <div class="container mx-auto px-4">
      <div class="grid grid-cols-1 md:grid-cols-4 gap-8">
        <div>
          <h3 class="text-xl font-bold mb-4 text-blue-600">i-STOKVEL</h3>
          <p class="text-gray-400">Together We Save, Together We Grow.</p>
        </div>
      </div>
    </div>
  </footer>
</div>
