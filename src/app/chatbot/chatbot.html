<div class="fixed bottom-4 right-4 z-50">
  <!-- Chat Button -->
  <button
    (click)="toggleChat()"
    class="bg-blue-600 text-white rounded-full p-3 shadow-lg hover:bg-blue-700 transition-colors duration-200 flex items-center justify-center"
    style="width: 56px; height: 56px;"
  >
    <div *ngIf="!isOpen; else closeIcon">
      <img
        [src]="botIconUrl"
        alt="Chatbot"
        class="w-8 h-8 object-contain"
      />
    </div>
    <ng-template #closeIcon>
      <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </ng-template>
  </button>

  <!-- Chat Window -->
  <div *ngIf="isOpen" class="absolute bottom-16 right-0 w-80 sm:w-96 bg-white rounded-lg shadow-xl flex flex-col">
    <!-- Chat Header -->
    <div class="bg-blue-600 text-white p-4 rounded-t-lg flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <img [src]="botIconUrl" alt="Chatbot" class="w-8 h-8 rounded-full bg-white p-1" />
        <div>
          <h3 class="font-semibold">i-STOKVEL Assistant</h3>
          <p class="text-sm text-blue-100">We're here to help!</p>
        </div>
      </div>
      <button
        (click)="handleClearMessages()"
        class="p-1 rounded-full text-blue-200 hover:text-white hover:bg-blue-500 focus:outline-none transition-colors duration-200"
        title="Clear chat"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
        </svg>
      </button>
    </div>

    <!-- Chat Messages -->
    <div class="flex-1 max-h-[60vh] overflow-y-auto p-4 space-y-4">
      <div
        *ngFor="let message of messages; let i = index"
        class="flex"
        [class.justify-end]="message.isUser"
        [class.justify-start]="!message.isUser"
      >
        <div class="flex items-end">
          <img
            *ngIf="!message.isUser"
            [src]="botIconUrl"
            alt="Bot"
            class="w-6 h-6 rounded-full mr-2 bg-white border"
          />
          <div
            class="max-w-[80%] rounded-lg p-3"
            [class.bg-blue-600]="message.isUser"
            [class.text-white]="message.isUser"
            [class.bg-gray-100]="!message.isUser"
            [class.text-gray-800]="!message.isUser"
          >
            {{ message.text }}
          </div>
          <div *ngIf="message.isUser" class="w-6 h-6 ml-2"></div>
        </div>
      </div>
    </div>

    <!-- Chat Input -->
    <div class="border-t p-4">
      <div class="flex space-x-2">
        <input
          type="text"
          [(ngModel)]="inputMessage"
          (keypress)="onKeyPress($event)"
          placeholder="Type your message..."
          class="flex-1 border rounded-lg px-4 py-2 focus:outline-none focus:border-blue-500"
        />
        <button
          (click)="handleSendMessage()"
          class="bg-blue-600 text-white rounded-lg px-4 py-2 hover:bg-blue-700 transition-colors duration-200"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" />
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>
