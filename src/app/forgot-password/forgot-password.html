<div class="h-screen bg-gradient-to-br from-blue-50 via-white to-blue-50 relative overflow-hidden">
  <!-- Animated Coins Background -->
  <div class="absolute inset-0 overflow-hidden">
    <div
      *ngFor="let coin of [].constructor(20); let i = index"
      class="absolute animate-float"
      [style.left]="(Math.random() * 100) + '%'"
      [style.top]="(Math.random() * 100) + '%'"
      [style.animation-delay]="(Math.random() * 5) + 's'"
      [style.animation-duration]="(5 + Math.random() * 5) + 's'"
    >
      <div class="w-8 h-8 bg-blue-500 rounded-full opacity-20 transform rotate-45"></div>
    </div>
  </div>

  <!-- Animated Savings Jar -->
  <div class="absolute top-10 right-10 w-32 h-40 animate-bounce-slow">
    <div class="relative w-full h-full">
      <div class="absolute bottom-0 w-full h-3/4 bg-blue-100 rounded-b-3xl border-2 border-blue-300">
        <div class="absolute inset-0 bg-blue-200 opacity-50 rounded-b-3xl animate-fill"></div>
      </div>
      <div class="absolute top-0 w-full h-1/4 bg-blue-200 rounded-t-3xl border-2 border-blue-300"></div>
    </div>
  </div>

  <div class="relative z-10 flex items-center justify-center h-screen p-4">
    <div class="w-full max-w-[600px] bg-white/80 backdrop-blur-lg rounded-2xl shadow-xl p-6">
      <div class="mb-4 text-center">
        <button
          (click)="handleBackToHome()"
          class="absolute top-4 left-4 text-gray-600 hover:text-blue-600 transition-colors duration-200"
        >
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
          </svg>
        </button>
        <h2 class="text-2xl font-bold text-gray-900 mb-1">
          Forgot Your Password?
        </h2>
        <p class="text-sm text-gray-600">
          Enter your email address below and we'll send you a link to reset your password.
        </p>
      </div>

      <div *ngIf="message" class="mb-4 bg-green-50 border border-green-200 text-green-700 px-3 py-2 rounded-lg text-sm">
        {{ message }}
      </div>

      <div *ngIf="error" class="mb-4 bg-red-50 border border-red-200 text-red-700 px-3 py-2 rounded-lg text-sm">
        {{ error }}
      </div>

      <form (submit)="handleSubmit($event)" class="space-y-6">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700">
            Email Address
          </label>
          <div class="mt-1">
            <input
              id="email"
              name="email"
              type="email"
              autocomplete="email"
              required
              [(ngModel)]="email"
              class="appearance-none block w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-blue-500 focus:border-blue-500 sm:text-sm"
            />
          </div>
        </div>

        <div>
          <button
            type="submit"
            [disabled]="loading"
            class="w-full flex justify-center py-2 px-4 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed"
          >
            {{ loading ? 'Sending...' : 'Send Reset Link' }}
          </button>
        </div>
      </form>

      <div class="mt-6 text-center text-sm">
        <a routerLink="/login" class="font-medium text-blue-600 hover:text-blue-700">
          Remember your password? Sign in
        </a>
      </div>
    </div>
  </div>
</div>
